# Fly.io yapılandırması
#
# Neden Fly.io: SQLite'ı olduğu gibi çalıştırabilmek için kalıcı bir
# diske ihtiyaç var. Fly'ın "volume" özelliği tam olarak bunu veriyor —
# Vercel gibi sunucusuz platformlarda dosya sistemi geçici olduğu için
# veritabanı her dağıtımda silinirdi.
#
# Kurulum:
#   fly launch --no-deploy --name servet-terminali
#   fly volumes create servet_data --size 1 --region fra
#   fly deploy
#
# `app` adını kendi seçtiğiniz adla değiştirin.

app = "servet-terminali"
primary_region = "fra"   # Frankfurt — Türkiye'ye en yakın düşük gecikmeli bölge

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  SERVET_PUBLIC = "1"
  SERVET_DB_PATH = "/data/servet.db"

# Kalıcı disk — veritabanı burada yaşar
[mounts]
  source = "servet_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # SQLite tek yazıcıya izin verir; birden fazla makine aynı diski
  # paylaşamaz. Tek kullanıcılık bir panel için bu zaten yeterli.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
